<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>مرکز مدیریت کاربران</title><style>:root{--bg:#f6f7f9;--card:#fff;--ink:#202124;--muted:#6f7379;--line:#e3e5e8;--blue:#2783de;--blue2:#e8f2fd;--green:#2f9563;--green2:#e8f4ed;--amber:#c87722;--red:#d9534f;--red2:#fcebea;--shadow:0 1px 2px #0000000d,0 8px 24px #00000008}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Tahoma,Arial,sans-serif;min-height:100vh}button,input{font:inherit}.shell{max-width:1180px;margin:auto;padding:24px}.top{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:24px}.brand{display:flex;align-items:center;gap:13px}.logo{width:48px;height:48px;border-radius:12px;background:linear-gradient(145deg,#2783de,#5e9fe8);color:#fff;display:grid;place-items:center;font-size:22px;font-weight:900;box-shadow:var(--shadow)}h1{font-size:23px;margin:0}.subtitle{color:var(--muted);font-size:13px;margin-top:5px}.topActions{display:flex;gap:8px}.btn{min-height:44px;border:1px solid var(--line);border-radius:9px;background:var(--card);color:var(--ink);padding:0 15px;font-weight:700;cursor:pointer}.btn:hover{border-color:#c8ccd1}.primary{background:var(--blue);border-color:var(--blue);color:#fff}.danger{color:var(--red)}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}.metric{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px;box-shadow:var(--shadow)}.metric small{color:var(--muted);font-size:13px}.metric strong{display:block;font-size:25px;margin-top:10px}.toolbar,.panel{background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow)}.toolbar{padding:14px;display:flex;gap:10px;align-items:center;margin-bottom:16px}.search{flex:1;min-height:44px;border:1px solid var(--line);border-radius:9px;padding:0 14px;outline:none}.search:focus,.field input:focus{border-color:var(--blue);box-shadow:0 0 0 3px var(--blue2)}.panel{padding:18px;margin-bottom:16px}.panelTitle{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:15px}.panelTitle h2{font-size:17px;margin:0}.muted{color:var(--muted)}.users{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.user{border:1px solid var(--line);border-radius:12px;padding:17px;background:#fff}.userTop{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.userName{font-size:17px;font-weight:800}.uid{font:12px Consolas,monospace;color:var(--muted);margin-top:5px}.tag{display:inline-flex;align-items:center;gap:5px;padding:5px 9px;border-radius:999px;background:var(--green2);color:var(--green);font-size:12px}.tag.off{background:var(--red2);color:var(--red)}.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:15px 0}.fact{background:var(--bg);border-radius:8px;padding:10px}.fact small{display:block;color:var(--muted);font-size:11px;margin-bottom:5px}.fact b{font-size:13px}.progress{height:7px;border-radius:99px;background:#edf0f2;overflow:hidden;margin:8px 0}.progress span{display:block;height:100%;background:linear-gradient(90deg,#2783de,#72bc8f);border-radius:99px}.usageText{display:flex;justify-content:space-between;color:var(--muted);font-size:12px}.actions{display:flex;flex-wrap:wrap;gap:7px;margin-top:15px}.mini{min-height:37px;border:1px solid var(--line);border-radius:8px;background:#fff;padding:0 10px;cursor:pointer;font-size:13px}.mini:hover{background:var(--bg)}.empty{text-align:center;padding:48px 16px;color:var(--muted)}.domains{display:flex;gap:9px}.domains input{flex:1;min-height:44px;border:1px solid var(--line);border-radius:9px;padding:0 13px}.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}.chip{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:8px 10px;font-size:12px}.events{max-height:220px;overflow:auto}.event{display:flex;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:12px}.event time{color:var(--muted);direction:ltr}.ok{color:var(--green)}.warn{color:var(--amber)}.error{color:var(--red)}dialog{border:0;border-radius:14px;padding:0;width:min(560px,calc(100% - 28px));box-shadow:0 24px 80px #0004}dialog::backdrop{background:#1118}.modal{padding:22px}.modalHead{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}.modalHead h2{margin:0;font-size:19px}.x{width:40px;height:40px;border:0;background:var(--bg);border-radius:8px;cursor:pointer}.formGrid{display:grid;grid-template-columns:1fr 1fr;gap:13px}.field label{display:block;font-size:12px;font-weight:700;margin-bottom:7px}.field input{width:100%;height:44px;border:1px solid var(--line);border-radius:8px;padding:0 11px;outline:none}.wide{grid-column:1/-1}.modalActions{display:flex;justify-content:flex-end;gap:8px;margin-top:20px}.toast{position:fixed;left:22px;bottom:22px;background:#202124;color:#fff;padding:12px 16px;border-radius:9px;opacity:0;transform:translateY(10px);transition:.2s;pointer-events:none;z-index:10}.toast.show{opacity:1;transform:none}@media(max-width:850px){.metrics{grid-template-columns:1fr 1fr}.users{grid-template-columns:1fr}.toolbar{flex-wrap:wrap}.search{flex-basis:100%}}@media(max-width:520px){.shell{padding:16px}.top{align-items:flex-start}.topActions .btn:first-child{display:none}.metrics{grid-template-columns:1fr 1fr}.metric{padding:14px}.facts{grid-template-columns:1fr 1fr}.formGrid{grid-template-columns:1fr}.wide{grid-column:auto}.domains{flex-direction:column}}@media(prefers-color-scheme:dark){:root{--bg:#191919;--card:#202020;--ink:#fff;--muted:#ffffffa6;--line:#ffffff2e;--blue:#5e9fe8;--blue2:#5e9fe824;--green:#72bc8f;--green2:#72bc8f20;--red:#e97366;--red2:#e9736620;--shadow:none}.user,.btn,.mini,.search,.domains input,.field input{background:#202020;color:#fff}.fact,.chip,.x{background:#292929}.progress{background:#383836}}</style></head><body><main class="shell"><header class="top"><div class="brand"><div class="logo">R</div><div><h1>مرکز مدیریت کاربران</h1><div class="subtitle">پنل خصوصی Railway · VLESS WebSocket TLS</div></div></div><div class="topActions"><button class="btn" onclick="loadAll()">به‌روزرسانی</button><button class="btn" onclick="logout()">خروج</button></div></header><section class="metrics"><article class="metric"><small>کل کاربران</small><strong id="mTotal">—</strong></article><article class="metric"><small>کاربران فعال</small><strong id="mActive">—</strong></article><article class="metric"><small>تونل‌های زنده</small><strong id="mStreams">—</strong></article><article class="metric"><small>مصرف ثبت‌شده</small><strong id="mUsage">—</strong></article></section><section class="toolbar"><input id="search" class="search" placeholder="جست‌وجوی نام یا UUID…"><button class="btn primary" onclick="openCreate()">+ ساخت کاربر</button><button class="btn" onclick="copyBotDoc()">راهنمای ربات</button></section><section class="panel"><div class="panelTitle"><h2>کاربران</h2><span id="resultCount" class="muted"></span></div><div id="users" class="users"></div><div id="empty" class="empty" hidden>هنوز کاربری ساخته نشده است.</div></section><details class="panel"><summary><b>دامنه‌های جایگزین</b> <span class="muted">(اختیاری)</span></summary><div style="margin-top:15px" class="domains"><input id="domain" dir="ltr" placeholder="vpn.example.com"><button class="btn" onclick="addDomain()">افزودن دامنه</button></div><div id="domainChips" class="chips"></div></details><details class="panel"><summary><b>گزارش اتصال</b> <span class="muted">برای عیب‌یابی</span></summary><div id="events" class="events" style="margin-top:12px"></div></details></main><dialog id="editor"><form id="userForm" class="modal"><div class="modalHead"><h2 id="modalTitle">ساخت کاربر</h2><button type="button" class="x" onclick="editor.close()">×</button></div><div class="formGrid"><div class="field wide"><label>نام کاربر</label><input id="fName" required maxlength="80"></div><div class="field"><label>حجم به گیگابایت؛ ۰ نامحدود</label><input id="fQuota" type="number" min="0" step="1" value="20"></div><div class="field"><label>تعداد دستگاه؛ ۰ نامحدود</label><input id="fDevices" type="number" min="0" max="20" value="0"></div><div class="field wide"><label>تاریخ انقضا؛ خالی یعنی بدون انقضا</label><input id="fExpiry" type="date"></div></div><div class="modalActions"><button type="button" class="btn" onclick="editor.close()">لغو</button><button class="btn primary">ذخیره و کپی ساب</button></div></form></dialog><div id="toast" class="toast"></div><script>let allUsers=[],editingId=null;const $=id=>document.getElementById(id);const fmt=n=>{if(!n)return'0 B';const u=['B','KB','MB','GB','TB'];let i=Math.min(4,Math.floor(Math.log(n)/Math.log(1024)));return(n/1024**i).toFixed(i>1?1:0)+' '+u[i]};const esc=v=>{let e=document.createElement('span');e.textContent=String(v??'');return e.innerHTML};function note(m){$('toast').textContent=m;$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),2300)}async function api(url,opt={}){let r=await fetch(url,{...opt,headers:{'content-type':'application/json',...(opt.headers||{})}});if(r.status===401){location='/login';throw Error('ورود لازم است')}let j=await r.json();if(!r.ok)throw Error(j.error||'خطا');return j}function pct(u){return u.quota_bytes?Math.min(100,Math.round(100*u.used_bytes/u.quota_bytes)):0}function render(){let q=$('search').value.trim().toLowerCase(),list=allUsers.filter(u=>!q||u.name.toLowerCase().includes(q)||u.id.includes(q));$('resultCount').textContent=list.length+' مورد';$('empty').hidden=list.length>0;$('users').innerHTML=list.map(u=>`<article class="user"><div class="userTop"><div><div class="userName">${esc(u.name)}</div><div class="uid">${u.id}</div></div><span class="tag ${u.enabled?'':'off'}">${u.enabled?'● فعال':'● خاموش'}</span></div><div class="facts"><div class="fact"><small>تونل زنده</small><b>${u.active_connections||0}</b></div><div class="fact"><small>دستگاه مجاز</small><b>${u.max_connections||'نامحدود'}</b></div><div class="fact"><small>انقضا</small><b>${u.expires_at?new Date(u.expires_at).toLocaleDateString('fa-IR'):'ندارد'}</b></div></div><div class="usageText"><span>${fmt(u.used_bytes)}</span><span>${u.quota_bytes?fmt(u.quota_bytes):'نامحدود'}</span></div><div class="progress"><span style="width:${pct(u)}%"></span></div><div class="actions"><button class="mini" data-act="sub" data-id="${u.id}">کپی ساب</button><button class="mini" data-act="direct" data-id="${u.id}">لینک مستقیم</button><button class="mini" data-act="edit" data-id="${u.id}">ویرایش</button><button class="mini" data-act="toggle" data-id="${u.id}">${u.enabled?'خاموش':'روشن'}</button><button class="mini" data-act="reset" data-id="${u.id}">صفرکردن مصرف</button><button class="mini danger" data-act="delete" data-id="${u.id}">حذف</button></div></article>`).join('')}async function loadAll(){let [users,status]=await Promise.all([api('/api/admin/users'),api('/api/admin/status')]);allUsers=users;$('mTotal').textContent=users.length;$('mActive').textContent=users.filter(u=>u.enabled).length;$('mStreams').textContent=status.active_streams;$('mUsage').textContent=fmt(users.reduce((a,u)=>a+u.used_bytes,0));render();renderEvents(status.recent_events);await loadDomains()}function renderEvents(items){$('events').innerHTML=items.length?items.map(e=>`<div class="event"><time>${new Date(e.time).toLocaleTimeString('fa-IR')}</time><span class="${e.level==='warning'?'warn':e.level}">${esc(e.message)}</span><code>${esc((e.user_id||'').slice(0,8))}</code></div>`).join(''):'<div class="empty">هنوز رویدادی ثبت نشده است.</div>'}function openCreate(){editingId=null;$('modalTitle').textContent='ساخت کاربر';$('fName').value='';$('fQuota').value=20;$('fDevices').value=0;$('fExpiry').value='';editor.showModal()}function openEdit(u){editingId=u.id;$('modalTitle').textContent='ویرایش '+u.name;$('fName').value=u.name;$('fQuota').value=u.quota_bytes?Math.round(u.quota_bytes/1024**3):0;$('fDevices').value=u.max_connections||0;$('fExpiry').value=u.expires_at?u.expires_at.slice(0,10):'';editor.showModal()}$('userForm').onsubmit=async e=>{e.preventDefault();let body={name:$('fName').value,quota_gb:+$('fQuota').value,max_connections:+$('fDevices').value,expires_at:$('fExpiry').value?new Date($('fExpiry').value+'T23:59:59Z').toISOString():null};let u=editingId?await api('/api/admin/users/'+editingId,{method:'PATCH',body:JSON.stringify(body)}):await api('/api/admin/users',{method:'POST',body:JSON.stringify(body)});await navigator.clipboard.writeText(u.subscription_url);editor.close();note('ذخیره شد و لینک ساب کپی شد');await loadAll()};$('users').onclick=async e=>{let b=e.target.closest('button');if(!b)return;let u=allUsers.find(x=>x.id===b.dataset.id),a=b.dataset.act;if(a==='sub'){await navigator.clipboard.writeText(u.subscription_url);note('ساب کپی شد')}if(a==='direct'){await navigator.clipboard.writeText(u.links[0]);note('لینک مستقیم کپی شد')}if(a==='edit')openEdit(u);if(a==='toggle'){await api('/api/admin/users/'+u.id,{method:'PATCH',body:JSON.stringify({enabled:!u.enabled})});await loadAll()}if(a==='reset'){if(confirm('مصرف این کاربر صفر شود؟')){await api('/api/admin/users/'+u.id,{method:'PATCH',body:JSON.stringify({reset_usage:true})});await loadAll()}}if(a==='delete'){if(confirm('کاربر حذف شود؟ لینک او فوراً قطع می‌شود.')){await api('/api/admin/users/'+u.id,{method:'DELETE'});await loadAll()}}};$('search').oninput=render;async function loadDomains(){let d=await api('/api/admin/domains');$('domainChips').innerHTML=`<span class="chip">اصلی: ${esc(d.primary)}</span>`+d.domains.map(x=>`<span class="chip">${esc(x)} <button data-domain="${esc(x)}">×</button></span>`).join('')}async function addDomain(){if(!$('domain').value)return;await api('/api/admin/domains',{method:'POST',body:JSON.stringify({domain:$('domain').value})});$('domain').value='';await loadDomains()}$('domainChips').onclick=async e=>{let d=e.target.dataset.domain;if(d){await api('/api/admin/domains/'+encodeURIComponent(d),{method:'DELETE'});await loadDomains()}};function copyBotDoc(){navigator.clipboard.writeText(location.origin+'/api/v1/users');note('آدرس API ربات کپی شد')}async function logout(){await fetch('/auth/logout',{method:'POST'});location='/login'}loadAll().catch(e=>note(e.message));setInterval(()=>loadAll().catch(()=>{}),10000);</script></body></html>
