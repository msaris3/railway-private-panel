<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ورود | پنل خصوصی</title><style>:root{--ink:#2c2c2b;--muted:#7d7a75;--line:#e6e5e3;--soft:#f9f8f7;--blue:#2783de;--red:#e56458}*{box-sizing:border-box}body{margin:0;font-family:Tahoma,Arial,sans-serif;background:#fff;color:var(--ink);min-height:100vh;display:grid;place-items:center;padding:24px}.card{width:min(420px,100%);border:1px solid var(--line);border-radius:12px;padding:32px;box-shadow:0 1px 2px #0000000d,0 4px 12px #0000000a}.mark{width:48px;height:48px;border-radius:10px;background:#e5f2fc;color:var(--blue);display:grid;place-items:center;font-size:24px;font-weight:700}h1{font-size:26px;margin:20px 0 8px}p{color:var(--muted);line-height:1.7;margin:0 0 24px}label{display:block;font-weight:700;margin-bottom:8px}input,button{width:100%;min-height:48px;border-radius:8px;font:inherit}input{border:1px solid var(--line);padding:0 14px;outline:none}input:focus{border-color:var(--blue);box-shadow:0 0 0 3px #e5f2fc}button{margin-top:16px;border:0;background:var(--blue);color:#fff;font-weight:700;cursor:pointer}button:disabled{opacity:.6}.err{min-height:24px;color:var(--red);font-size:14px;margin-top:12px}</style></head><body><main class="card"><div class="mark">R</div><h1>ورود به پنل خصوصی</h1><p>این صفحه فقط برای مدیر است. ربات از کلید API جداگانه استفاده می‌کند.</p><form id="f"><label for="pw">رمز مدیریت</label><input id="pw" type="password" autocomplete="current-password" required autofocus><button id="btn">ورود</button><div id="err" class="err" role="alert"></div></form></main><script>f.onsubmit=async e=>{e.preventDefault();btn.disabled=true;err.textContent='';try{let r=await fetch('/auth/login',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({password:pw.value})});let j=await r.json();if(!r.ok)throw Error(j.error||'خطا');location='/dashboard'}catch(x){err.textContent=x.message}finally{btn.disabled=false}}</script></body></html>
